<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SPECIAL FOR ICHA</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Cormorant+Garamond:ital,wght@0,500;1,400;1,500&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b1220;--hd:#101b33;--bub:#1a2a4a;--gold:#ffcf7a;--tx:#eef3ff;--mut:#8ea0c4;color-scheme:dark;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;background:#05080f;color:var(--tx);font-family:Nunito,system-ui,-apple-system,sans-serif;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer;border:0}
#lock,#app,#end{position:fixed;inset:0;margin:auto;max-width:520px}
/* lock screen */
#lock{z-index:10;display:flex;flex-direction:column;align-items:center;padding:calc(env(safe-area-inset-top,0px) + 1.2vh) 1.1rem 0;overflow:hidden;background:linear-gradient(180deg,#8dc9ef 0%,#b8e0f2 35%,#ffe3b0 68%,#f5a66d 100%);transition:opacity 1s,transform 1s;touch-action:pan-y}
#lock.off{opacity:0;transform:scale(1.08);pointer-events:none}
#lock>*{position:relative;z-index:2}#lock>#lsc{position:absolute}
#lsc{inset:0;z-index:1;pointer-events:none;overflow:hidden}
.sb{width:100%;display:flex;justify-content:space-between;font-size:.74rem;font-weight:700;padding:.5rem .3rem;color:#fffaf0}
#lock .d{margin-top:2.2vh;font-size:.95rem;color:#fffaf0;letter-spacing:.04em;font-weight:800;text-shadow:0 1px 8px #8b5a3a55}
#lock .t{font:800 clamp(4.6rem,23vw,6.4rem)/1 Nunito;margin:.1rem 0 1.2rem;color:#fffaf0;text-shadow:0 2px 24px #9b5d3b55}
.moon{position:absolute;right:13%;top:14%;width:64px;height:64px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff8d8,#ffd36b 65%,#ffae45);box-shadow:0 0 40px 14px #ffe6b455,0 0 120px 50px #ffd9a044}
.stl{position:absolute;width:2px;height:2px;border-radius:50%;background:#fff;animation:tw 3s ease-in-out infinite}
@keyframes tw{50%{opacity:.15;transform:scale(.6)}}
.lc{position:absolute;border-radius:50px;background:#ffb88a40;filter:blur(14px);animation:dr linear infinite}
@keyframes dr{from{transform:translateX(-45vw)}to{transform:translateX(150vw)}}
.city{position:absolute;left:0;right:0;bottom:0;height:17vh;background:linear-gradient(#b57c5b,#8d6b59);clip-path:polygon(0 45%,7% 45%,7% 20%,16% 20%,16% 52%,27% 52%,27% 30%,38% 30%,38% 58%,50% 58%,50% 12%,60% 12%,60% 48%,72% 48%,72% 26%,84% 26%,84% 54%,93% 54%,93% 36%,100% 36%,100% 100%,0 100%)}
#nots{width:100%;display:flex;flex-direction:column;gap:.5rem}
.noti{display:flex;gap:.7rem;align-items:center;text-align:left;width:100%;background:#ffffff24;backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid #ffffff22;border-radius:18px;padding:.7rem .8rem;animation:ni .6s cubic-bezier(.2,1.2,.4,1) both;box-shadow:0 8px 26px #0005}
@keyframes ni{from{opacity:0;transform:translateY(-24px) scale(.95)}}
.ni{width:42px;height:42px;border-radius:12px;flex:none;background-size:190%;background-color:#2a3a60;border:1.5px solid #ffffff55}
.noti b{display:flex;justify-content:space-between;font-size:.82rem}.noti b i{font-style:normal;font-weight:400;font-size:.7rem;color:#cfdcf5}
.noti span{font-size:.88rem;color:#f1f5ff;display:block}.noti small{display:block;font-size:.62rem;letter-spacing:.14em;color:#ffd9a0;margin-bottom:1px;font-weight:800}
#hint{margin-top:auto;margin-bottom:calc(env(safe-area-inset-bottom,0px) + 3.5vh);font-size:.72rem;letter-spacing:.25em;color:#fffaf0;animation:bl 2.6s infinite;text-transform:uppercase}
@keyframes bl{50%{opacity:.35}}
/* chat */
#app{z-index:5;display:flex;flex-direction:column;background:var(--bg);background-image:radial-gradient(#ffffff14 1px,transparent 1.5px),radial-gradient(#ffffff0c 1px,transparent 1.5px);background-size:46px 46px,29px 29px;background-position:0 0,13px 17px;opacity:0;transition:opacity .8s}
#app.on{opacity:1}
#hd{display:flex;align-items:center;gap:.7rem;padding:.7rem .9rem;background:var(--hd);border-bottom:1px solid #ffffff12}
#hd .gi{width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,#ffcf7a,#ff8a5c);display:grid;place-items:center}
#hd b{display:block;font-size:1rem}#hd small{color:var(--mut);font-size:.75rem}#st{color:#7ee0a0!important}
#chat{flex:1;overflow-y:auto;padding:1rem .8rem .5rem;display:flex;flex-direction:column;gap:.55rem;scroll-behavior:smooth}
.sys{align-self:center;font-size:.72rem;color:var(--mut);background:#ffffff10;padding:.25rem .8rem;border-radius:20px;animation:in .4s both}
.row{display:flex;gap:.5rem;align-items:flex-end;animation:in .35s both}
.row.me{justify-content:flex-end}
@keyframes in{from{opacity:0;transform:translateY(10px)}}
.av{width:36px;height:36px;border-radius:50%;flex:none;border:2px solid var(--c);background-color:#223356;background-size:cover}
.col{max-width:78%;display:flex;flex-direction:column;gap:.35rem;align-items:flex-start}
.nm{font-size:.72rem;font-weight:700;color:var(--c);margin-left:.4rem}
.b{background:var(--bub);padding:.6rem .85rem;border-radius:4px 18px 18px 18px;font-size:.94rem;line-height:1.5}
.me .b{background:linear-gradient(135deg,#ffc36b,#ff8f5c);color:#2a1606;border-radius:18px 18px 4px 18px;font-weight:600}
.dots{display:flex;gap:4px;padding:.8rem .9rem}.dots i{width:7px;height:7px;border-radius:50%;background:#8ea0c4;animation:dt 1s infinite}.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes dt{40%{transform:translateY(-5px);background:#fff}}
.stk{height:min(30vh,200px);max-width:70vw;object-fit:contain;animation:stk .7s cubic-bezier(.2,1.6,.4,1) both;filter:drop-shadow(2px 0 0 #fff) drop-shadow(-2px 0 0 #fff) drop-shadow(0 2px 0 #fff) drop-shadow(0 -2px 0 #fff) drop-shadow(0 6px 10px #0008);transform-origin:0 100%}
@keyframes stk{from{transform:scale(.2) rotate(-12deg);opacity:0}}
.note{align-self:center;width:94%;background:linear-gradient(180deg,#fff6dc,#f7e4b4);color:#4a3418;border-radius:14px;padding:1.1rem 1.2rem;font-size:.95rem;line-height:1.75;box-shadow:0 12px 34px #000a;transform:rotate(-.6deg);animation:in .8s both}
.note .pin{font-size:.7rem;letter-spacing:.18em;color:#a0701c;font-weight:700;margin-bottom:.5rem}
.note p{margin-bottom:.7rem}.note em{font-family:Georgia,serif;font-size:1.08rem;color:#8a4a18}
#bar{padding:.6rem .8rem calc(env(safe-area-inset-bottom,0px) + .7rem);background:var(--hd);border-top:1px solid #ffffff12;min-height:64px;display:flex;gap:.5rem;flex-wrap:wrap;align-items:center;justify-content:center}
.ph{color:var(--mut);font-size:.82rem}
.chip{padding:.55rem 1rem;border-radius:22px;background:#ffffff14;border:1px solid #ffcf7a77;color:var(--gold);font-size:.88rem;animation:in .4s both}
.chip:active{background:#ffcf7a33}
.send{padding:.7rem 2rem;border-radius:30px;background:linear-gradient(135deg,#ffc36b,#ff8f5c);color:#2a1606;font-weight:800;letter-spacing:.05em;animation:in .5s both,pu 1.8s 1s infinite}
@keyframes pu{50%{transform:scale(1.06)}}
.ht{position:fixed;top:-30px;font-size:1.3rem;pointer-events:none;animation:fall linear forwards;z-index:20}
@keyframes fall{to{transform:translateY(110vh) rotate(40deg);opacity:.2}}
#end{z-index:30;opacity:0;pointer-events:none;transition:opacity 2.5s;background:#070a1f}
#end.on{opacity:1;pointer-events:auto}
#esk{position:absolute;inset:0;width:100%;height:100%}
#etx{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:1.6rem}
#ln{font:italic 500 clamp(1.4rem,6vw,2rem)/1.5 'Cormorant Garamond',serif;color:#fff;text-shadow:0 2px 24px #0008,0 0 6px #0004;opacity:0;transition:opacity 1.8s;min-height:3em}
#ln.on{opacity:1}
#fb{opacity:0;transition:opacity 3s;pointer-events:none;position:relative;isolation:isolate}#fb::before{content:'';position:absolute;inset:-14% -24%;z-index:-1;background:radial-gradient(ellipse at center,#1c2460a8,#1c246000 68%)}#fb.on{opacity:1;pointer-events:auto}
#fb h1{font:800 clamp(1.5rem,7vw,2.4rem)/1.35 Nunito;letter-spacing:.1em;color:#fff7e6;text-shadow:0 0 30px #ffb46a99,0 2px 16px #3a2a7a88}
#fb p{margin-top:1rem;font:italic 500 clamp(1.1rem,4.6vw,1.4rem)/1.6 'Cormorant Garamond',serif;color:#ffe9cf;text-shadow:0 2px 16px #0009}
#fb p.sm{font-size:1rem;color:#dbe6ff;margin-top:1.4rem}
#fb button{margin-top:2rem;padding:.7rem 1.6rem;border-radius:30px;background:#ffffff14;border:1px solid #ffffff66;color:#fff;font-size:.78rem;letter-spacing:.15em}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important}}

#hd .stk{display:flex;padding-left:8px;flex:none;height:auto;max-width:none;filter:none;animation:none}#hd .stk .av{width:28px;height:28px;margin-left:-8px;border-width:1.5px;background-size:190%}
#hd b{font-weight:800;letter-spacing:.01em}
#chat{padding:1rem .8rem .8rem;scrollbar-width:none}
.av{animation:bob 4s ease-in-out infinite}@keyframes bob{50%{transform:translateY(-2px) scale(1.05)}}
.typing .av{animation:tp .9s ease-in-out infinite}@keyframes tp{50%{box-shadow:0 0 0 5px color-mix(in srgb,var(--c) 40%,transparent)}}
.b{position:relative;box-shadow:0 2px 10px #0004}.me .b{box-shadow:0 4px 16px #ff8f5c44}
.rx{position:absolute;right:-8px;bottom:-12px;width:24px;height:24px;border-radius:50%;background:var(--hd);border:1.5px solid var(--c);display:grid;place-items:center;font-size:.8rem;animation:rxp .5s cubic-bezier(.2,1.8,.4,1) both}
@keyframes rxp{from{transform:scale(0)}}
.stk{height:min(28dvh,190px)}
.stk.s-levi{animation:stk .7s cubic-bezier(.2,1.6,.4,1) backwards,i1 6s .8s ease-in-out infinite}
.stk.s-eren{animation:stk .7s cubic-bezier(.2,1.6,.4,1) backwards,i2 1.5s .8s ease-in-out infinite}
.stk.s-nouzen{animation:stk .7s cubic-bezier(.2,1.6,.4,1) backwards,i3 7s .8s ease-in-out infinite}
.stk.s-mikasa{animation:stk .7s cubic-bezier(.2,1.6,.4,1) backwards,i4 3.5s .8s ease-in-out infinite}
.stk.s-akame{animation:stk .7s cubic-bezier(.2,1.6,.4,1) backwards,i5 4s .8s ease-in-out infinite}
.stk.s-lena{animation:stk .7s cubic-bezier(.2,1.6,.4,1) backwards,i6 5s .8s ease-in-out infinite}
@keyframes i1{50%{transform:rotate(2.5deg)}}@keyframes i2{50%{transform:translateY(-7px)}}@keyframes i3{50%{transform:translateX(5px)}}@keyframes i4{50%{transform:rotate(-3deg) translateY(-2px)}}@keyframes i5{0%,86%,100%{transform:none}93%{transform:rotate(-6deg) scale(1.05)}}@keyframes i6{50%{transform:translateY(-9px)}}
.note{font-family:'Cormorant Garamond',Georgia,serif;font-size:1.12rem;line-height:1.75}
.note p{margin-bottom:.8rem}.note p.lp{opacity:0;transform:translateY(8px);transition:opacity 1.5s,transform 1.5s}.note p.lp.in{opacity:1;transform:none}
.note .hdr{display:flex;align-items:center;gap:.65rem;margin-bottom:.7rem}.note .hdr .pin{margin:0}.note .hdr .av{width:46px;height:46px;border-color:#d9a441;animation:none;box-shadow:0 3px 10px #7a4e1a44}
.dim .row,.dim .sys{opacity:.25;transition:opacity 1.6s}
.dim #hd{opacity:.6;transition:opacity 1.6s}
#app{height:100dvh}
</style>
</head>
<body>
<div id="lock">
  <div id="lsc"><div class="moon"></div><div class="city"></div></div>
  <div class="sb"><span>●●●○ 4G</span><span>38% 🔋</span></div>
  <div class="d">Pagi hari TKA</div><div class="t">05:30</div>
  <div id="nots"></div>
  <div id="hint">ketuk atau geser ke atas ↑</div>
</div>
<div id="app">
  <div id="hd"><div class="stk" id="stk"></div><div><b id="gn">NONCHALANT GROUP ^_^</b><small id="st">7 anggota · online</small></div></div>
  <div id="chat"></div>
  <div id="bar"><span class="ph">…</span></div>
</div>
<div id="end"><canvas id="esk"></canvas><div id="etx"><p id="ln"></p><div id="fb"><h1>GOOD LUCK TODAY,<br>ICHAA. ♡</h1><p>One test. One day.<br>Not the whole story of your life.</p><p class="sm">Kamu boleh gugup. Kamu boleh salah.<br>Dan kamu tetap mampu melangkah hari ini.</p><button onclick="location.reload()">↻ buka obrolannya lagi</button></div></div></div>

<script>
/* ===== KONFIGURASI GAMBAR: taruh gambar baru di assets/characters/ (nama file di bawah), lalu atur crop avatar di K =====
   FOTO UXIE: ganti file  assets/characters/uxie.webp  dengan fotomu (jpg/png juga boleh, tinggal ubah nama di FILES.uxie).
   Kalau wajah kurang pas di lingkaran: ubah p (posisi, '50% 35%' = tengah, 35% dari atas) atau z (angka = zoom %, 'cover' = otomatis). */
const ASSET='assets/characters/';
const FILES={levi:'levi.webp',eren:'eren.webp',nouzen:'nouzen.webp',mikasa:'mikasa.webp',akame:'akame.webp',lena:'lena.webp',uxie:'uxie.webp'};
const IMG=Object.fromEntries(Object.entries(FILES).map(([k,f])=>[k,ASSET+f]));
/* p = posisi crop wajah di avatar, z = zoom (%) */
const K={levi:{n:'Levi',c:'#8fd0a4',p:'38% 30%',z:210},eren:{n:'Eren',c:'#ffb27a',p:'50% 14%',z:190},nouzen:{n:'Nouzen',c:'#8ad0e8',p:'50% 22%',z:190},mikasa:{n:'Mikasa',c:'#ff8a9a',p:'50% 22%',z:190},akame:{n:'Akame',c:'#ff6a7a',p:'50% 12%',z:190},lena:{n:'Lena',c:'#bcd4ff',p:'50% 12%',z:190},uxie:{n:'Aa Uxie',c:'#ffcf7a',p:'50% 35%',z:'cover'}};
const RM=matchMedia('(prefers-reduced-motion: reduce)').matches,ON='7 anggota · online';
const $=id=>document.getElementById(id),w=ms=>new Promise(r=>setTimeout(r,RM?Math.min(ms,120):ms));
const ch=$('chat'),bar=$('bar'),S={feel:''},T=x=>typeof x==='function'?x(S):x;
const down=f=>{if(f||ch.scrollHeight-ch.scrollTop-ch.clientHeight<170)ch.scrollTo({top:ch.scrollHeight})};
const avs=k=>`<div class="av a-${k}" style="--c:${K[k].c};background-image:url(${IMG[k]});background-position:${K[k].p};background-size:${K[k].z==='cover'?'cover':K[k].z+'%'};animation-delay:-${Math.random()*3|0}s"></div>`;
const uxiePhoto=new Promise(r=>{const i=new Image();i.onload=()=>r(1);i.onerror=()=>r(0);i.src=IMG.uxie});/* kalau foto Uxie tidak ada, otomatis pakai emoji 💌 */
$('stk').innerHTML=Object.keys(K).filter(k=>k!=='uxie').map(avs).join('');
function sys(x){const e=document.createElement('div');e.className='sys';e.textContent=x;ch.appendChild(e);down(1)}
async function msg(k,x,s,rx){
 x=T(x);const r=document.createElement('div');r.className='row typing';r.style.setProperty('--c',K[k].c);
 r.innerHTML=`${avs(k)}<div class="col"><span class="nm">${K[k].n}</span><div class="b dots"><i></i><i></i><i></i></div></div>`;ch.appendChild(r);down(1);
 $('st').textContent=K[k].n+' sedang mengetik…';await w(550+x.length*22);
 r.classList.remove('typing');const b=r.querySelector('.b');b.className='b';b.textContent=x;$('st').textContent=ON;down(1);
 if(rx){await w(450);const e=document.createElement('span');e.className='rx';e.style.setProperty('--c',K[rx[0]].c);e.textContent=rx[1];b.appendChild(e)}
 if(s){await w(450);const im=document.createElement('img');im.className='stk s-'+k;im.src=IMG[k];im.alt='';r.querySelector('.col').appendChild(im);down(1)}
 await w(750);
}
function me(x){const r=document.createElement('div');r.className='row me';r.innerHTML=`<div class="b">${x}</div>`;ch.appendChild(r);down(1)}
async function ask(q,opts){
 sys(q);bar.innerHTML='';
 const i=await new Promise(res=>opts.forEach((o,j)=>{const c=document.createElement('button');c.className='chip';c.style.animationDelay=j*.12+'s';c.textContent=o.l;c.onclick=()=>res(j);bar.appendChild(c)}));
 bar.innerHTML='<span class="ph">…</span>';me(opts[i].l);if(opts[i].f)S.feel=opts[i].f;await w(900);
 for(const a of opts[i].r)await msg(...a);
}
const LET=`Hey, Ichaa.

Hari ini mulai TKA yaaw? Mangatss yaa!! Wajar kalau agak gugup di Hari pertama, Ichaa.

Kamu nggak harus menjadi sempurna hari ini, yang penting kamu try your best.

Kalau ada soal yang sulit, tarik napas. Kalau ada hal yang nggak sesuai harapan, jangan langsung nyalahin diri sendiri. Klo gatau jawabannya kan ada tang ting tung ygy.

Intinya kalau nanti semuanya udah selesai, apa pun hasilnya, semoga tetap bisa enjoyy sama apa yg udah kamu lakuin sejauh ini yaaw.

Aku cuman bisa bantu doa aja.

Berharap yang terbaik buat ichaa.

So, do your best, okay?

Your day doesn't have to be perfect to be beautiful. ♡

— from your online brother, Uxie.`;

async function letter(){
 const hu=await uxiePhoto;
 ch.insertAdjacentHTML('beforeend',`<div class="note"><div class="hdr">${hu?avs('uxie'):''}<div class="pin">📌 PESAN DARI UXIE</div></div></div>`);const n=ch.lastChild;
 for(const p of LET.split('\n\n')){const e=document.createElement('p');e.className='lp';e.textContent=p;if(p.startsWith('—'))e.style.textAlign='right';n.appendChild(e);down(1);await w(80);e.classList.add('in');await w(2100)}
}
/* ===== alur obrolan ===== */
let opened=0;
async function openChat(){
 if(opened)return;opened=1;$('lock').classList.add('off');$('app').classList.add('on');setTimeout(()=>Sky.prep(),3500);await w(1400);
 sys('Pagi ini · 05:30');await w(600);sys('Ichaa bergabung ke grup ☀️');await w(1000);
 await msg('eren','ICHAAAA 🔥🔥 hari ini TKA kan?! Ayo semangaaat!!');
 await msg('mikasa','Eren. Volume.',0,['levi','😒']);
 await msg('eren','Aku ngetik, bukan teriak.');
 await msg('levi','Huruf kapital dan dua tanda seru. Itu teriak.');
 await msg('eren','...');
 await msg('levi','Ichaa, abaikan mereka. Satu hal penting: meja belajarmu sudah rapi? Pikiran jernih mulai dari meja bersih.',1);
 await msg('akame','Target hari ini: selesai ujian, kita makan daging. Setuju?',0,['eren','🍖']);
 await msg('nouzen','...kamu nggak harus menjawab semuanya sekarang.');
 await msg('lena','Selamat pagi, Ichaa. Maaf ya, mereka memang seramai ini. Gimana perasaanmu menjelang TKA?');
 await ask('Gimana perasaanmu sekarang?',[
  {l:'Deg-degan banget 😣',f:'nervous',r:[['mikasa','Tarik napas pelan-pelan. Aku di sini.'],['eren','Aku juga deg-degan kalau mau ujian kok!'],['levi','Eren, kamu cuma deg-degan kalau kehabisan roti.'],['eren','Itu juga serius!!'],['nouzen','Deg-degan itu tanda kamu peduli. Itu bukan kelemahan.',1]]},
  {l:'Masih ngantuk dan capek 😵‍💫',f:'tired',r:[['lena','Nggak apa-apa, pelan-pelan dulu. Minum air dan tarik napas.'],['akame','Sarapan sedikit kalau bisa. Biar ada tenaga.'],['levi','Cuci muka, cek barang bawaan, lalu berangkat tepat waktu.'],['eren','KITA LAWAN NGANTUKNYA!! 🔥'],['mikasa','Jangan berisik, Eren.'],['eren','...semangat pelan-pelan 🙄']]},
  {l:'Aku siap! 💪',f:'ready',r:[['eren','NAH GITU DONG!! 🔥'],['levi','Hmph. Bagus. Tapi jangan sombong.'],['akame','Siap itu bagus. Tetap makan dulu.'],['mikasa','Tetap tenang dan fokus, ya.']]}]);

await msg('mikasa',s=>({nervous:'Kalau masih deg-degan, tarik napas pelan-pelan ya, Ichaa.',tired:'Mulai pagi ini pelan-pelan aja. Kamu nggak harus buru-buru panik.',ready:'Semangatmu bagus. Simpan energi buat mengerjakan soal satu per satu.'}[s.feel]));

await msg('mikasa','Checklist sebelum berangkat: kartu peserta, dokumen yang diperlukan, alat tulis sesuai aturan, dan air minum jika diizinkan. Sudah siap semua?');
await ask('Checklist-nya gimana?',[
 {l:'Udah semua ✅',r:[['mikasa','Bagus. Aku bangga.'],['levi','Tidak ada yang tertinggal. Rapi.',0,['mikasa','👍']]]},
